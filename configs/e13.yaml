# E13: Crossover sigma* (PLAN.md section 0 / section 5) -- the headline
# finding. Fine grid over (h, sigma) decomposing solver-bias vs noise-std,
# to locate the crossover sigma*(h) where they're equal.
model: SIR
n_total: 1000.0
i0: 1.0
theta_true: {beta: 0.3, gamma: 0.1}
solver: euler   # the solver being compared against an (approximately) exact RK4
h_values:
  quick: [0.5, 1.0, 2.0]
  full: [0.1, 0.25, 0.5, 1.0, 1.5, 2.0, 3.0]
sigma_fracs:
  quick: [0.0, 0.005, 0.01, 0.02, 0.05, 0.1]
  full: [0.0, 0.0025, 0.005, 0.0075, 0.01, 0.015, 0.02, 0.03, 0.05, 0.08, 0.12, 0.2]
dt: 1.0
t_obs_final: 60.0
n_replicates:
  quick: 25
  full: 300
n_jobs: 8
seed: 13
