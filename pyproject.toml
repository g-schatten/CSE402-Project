[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sirlab"
version = "0.1.0"
description = "Numerical analysis of the SIR epidemic model: hand-written solvers, parameter estimation, and uncertainty quantification"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# tests (scipy cross-checks, hypothesis), figures (matplotlib), notebooks (pandas)
dev = [
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "pytest>=7.4",
    "hypothesis>=6.90",
]

[tool.setuptools.packages.find]
where = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
